# Production stack for the BACH VPS (/srv/bach). Deployed by GitHub Actions.
# Public traffic (ports 80/443, TLS) is handled by the shared neutral edge proxy in /srv/edge,
# which joins the "bach" network. This project's site config ships to /srv/edge/sites/bach.caddy.
name: bach
services:
  storefront:
    image: ghcr.io/bachwears/bach-storefront:latest
    restart: unless-stopped
    networks: [bach]

  pos:
    image: ghcr.io/bachwears/bach-pos:latest
    restart: unless-stopped
    networks: [bach]

  mgmt:
    image: ghcr.io/bachwears/bach-mgmt:latest
    restart: unless-stopped
    networks: [bach]

networks:
  bach:
    name: bach
