name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        app: [storefront, pos, mgmt]
    steps:
      - name: Guard required secrets
        run: |
          test -n "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" || { echo "::error::NEXT_PUBLIC_SUPABASE_URL secret is missing or misnamed"; exit 1; }
          test -n "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" || { echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY secret is missing or misnamed"; exit 1; }
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/bachwears/bach-${{ matrix.app }}:latest
            ghcr.io/bachwears/bach-${{ matrix.app }}:${{ github.sha }}
          build-args: |
            APP=${{ matrix.app }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,scope=${{ matrix.app }},mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null
      - name: Ship compose + Caddyfile
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "mkdir -p /srv/bach/caddy"
          scp deploy/docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/srv/bach/docker-compose.yml
          scp deploy/Caddyfile ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/srv/bach/caddy/Caddyfile
      - name: Pull and restart stack
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin &&
            cd /srv/bach &&
            docker compose pull &&
            docker compose up -d --remove-orphans &&
            docker image prune -f &&
            docker logout ghcr.io
          "
      - name: Health check
        run: |
          sleep 5
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            docker compose -f /srv/bach/docker-compose.yml ps --format '{{.Name}}: {{.Status}}' &&
            curl -sf -o /dev/null -w 'storefront via caddy: %{http_code}\n' http://localhost/
          "
